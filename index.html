<!doctype html>
<!--
THESIS: A compact outlook dashboard with a faithful spreadsheet view when needed.
OWN-WORLD: White canvas, hairline rules, system sans, one restrained blue accent.
STORY: Filter a segment and period, scan portfolio changes, then inspect product detail.
FIRST VIEWPORT: Compact filters, period summary, product breakdown, and quarterly trend.
FORM: Operate view, report-inspired layout, user-pinned minimalist styling.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Super Summary | FY27 Outlook</title>
<style>
:root {
  color-scheme: light;
  --page: #fff;
  --surface: #fff;
  --text: #19242d;
  --muted: #596873;
  --rule: #d7dde1;
  --rule-strong: #aab5bc;
  --accent: #176b87;
  --accent-soft: #e8f2f6;
  --positive: #176b45;
  --negative: #b42318;
  --focus: #005fcc;
  --chart-budget: #c27803;
  --chart-prior: #66737d;
  font-family: "Aptos Narrow", "Segoe UI", Arial, sans-serif;
  font-synthesis: none;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--text); font-size: 14px; line-height: 1.4; }
button, input { font: inherit; }
button { color: inherit; }
.page { padding: 22px clamp(14px, 2.4vw, 36px) 36px; }
.masthead { display: flex; align-items: end; justify-content: space-between; gap: 16px; border-bottom: 2px solid var(--text); padding-bottom: 12px; }
h1 { margin: 0; font-size: 25px; line-height: 1.15; font-weight: 650; letter-spacing: -.025em; }
.subtitle { margin: 5px 0 0; color: var(--muted); }
.sample-label { white-space: nowrap; color: var(--muted); font-size: 12px; font-weight: 650; letter-spacing: .04em; text-transform: uppercase; }
.controls { display: grid; gap: 11px; padding: 14px 0 12px; border-bottom: 1px solid var(--rule-strong); }
.control-row { display: flex; align-items: center; flex-wrap: wrap; gap: 7px; }
.control-title { min-width: 72px; color: var(--muted); font-size: 12px; font-weight: 650; }
.chip-list { display: flex; flex-wrap: wrap; gap: 5px; }
.chip { min-height: 32px; border: 1px solid var(--rule); border-radius: 2px; padding: 5px 11px; background: transparent; cursor: pointer; }
.chip:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
.chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent); color: #fff; }
.chip:disabled { color: var(--muted); opacity: .58; cursor: not-allowed; }
.chip:focus-visible, input:focus-visible + .toggle-label, .block-toggle:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.toggle-list { display: flex; flex-wrap: wrap; column-gap: 22px; row-gap: 8px; }
.toggle { display: inline-flex; align-items: center; gap: 7px; min-height: 30px; cursor: pointer; }
.toggle input { width: 16px; height: 16px; margin: 0; accent-color: var(--accent); }
.toggle-label { border-radius: 1px; }
.status { min-height: 20px; margin: 10px 0 7px; color: var(--muted); font-size: 12px; }
.grid-scroll { overflow: auto; max-width: 100%; border-top: 1px solid var(--rule-strong); border-bottom: 1px solid var(--rule-strong); scrollbar-color: var(--rule-strong) transparent; }
table { width: max-content; min-width: 100%; border-collapse: separate; border-spacing: 0; font-variant-numeric: tabular-nums; }
caption { padding: 9px 0; color: var(--muted); text-align: left; font-size: 12px; }
th, td { min-width: 94px; padding: 7px 10px; border-bottom: 1px solid var(--rule); text-align: right; white-space: nowrap; }
thead th { position: sticky; z-index: 2; top: 0; background: var(--surface); color: var(--muted); font-size: 11px; font-weight: 650; }
thead tr:first-child th { border-bottom: 1px solid var(--rule-strong); color: var(--text); }
th:first-child, td:first-child { position: sticky; z-index: 1; left: 0; min-width: 255px; text-align: left; background: var(--surface); }
thead th:first-child { z-index: 3; }
tbody tr:hover td { background: var(--accent-soft); }
tbody tr:hover td:first-child { background: var(--accent-soft); }
tbody tr.block-total th, tbody tr.block-total td { border-top: 1px solid var(--rule-strong); font-weight: 700; }
tbody tr.summary-line th { font-weight: 650; }
tbody tr.detail-line th { padding-left: 30px; color: var(--muted); font-weight: 400; }
tbody tr.other-line th { padding-left: 30px; }
.block-toggle { display: inline-flex; align-items: center; gap: 8px; border: 0; padding: 0; background: transparent; text-align: left; font-weight: 700; cursor: pointer; }
.chevron { display: inline-block; width: 14px; color: var(--accent); font-size: 15px; line-height: 1; }
.positive { color: var(--positive); font-weight: 650; }
.negative { color: var(--negative); font-weight: 650; }
.empty { padding: 28px 12px; color: var(--muted); text-align: center; }
.view-panel[hidden], [hidden] { display: none !important; }
.control-input { min-height: 34px; border: 1px solid var(--rule-strong); border-radius: 2px; padding: 5px 9px; background: var(--surface); color: var(--text); }
.control-input:focus-visible, .view-button:focus-visible, .product-select:focus-visible, .product-link:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.search-input { width: min(320px, 100%); }
.view-list { display: flex; gap: 5px; }
.view-button { min-height: 32px; border: 1px solid var(--rule); border-radius: 2px; padding: 5px 12px; background: transparent; cursor: pointer; }
.view-button:hover { border-color: var(--accent); color: var(--accent); }
.view-button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent); color: #fff; }
.overview-summary { display: grid; grid-template-columns: minmax(240px, .75fr) minmax(420px, 1.25fr); gap: 22px; align-items: start; padding: 18px 0 20px; border-bottom: 1px solid var(--rule-strong); }
h2 { margin: 0 0 7px; font-size: 18px; line-height: 1.25; font-weight: 650; letter-spacing: -.015em; }
.summary-copy, .section-note { margin: 0; color: var(--muted); }
.summary-table-wrap, .table-scroll { overflow: auto; max-width: 100%; }
.summary-table, .breakdown-table { width: 100%; min-width: 540px; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.summary-table th, .summary-table td, .breakdown-table th, .breakdown-table td { min-width: 82px; padding: 7px 9px; border: 1px solid var(--rule); text-align: right; white-space: nowrap; }
.summary-table thead th, .breakdown-table thead th { background: var(--accent); color: #fff; font-size: 11px; font-weight: 650; }
.summary-table th:first-child, .summary-table td:first-child, .breakdown-table th:first-child, .breakdown-table td:first-child { text-align: left; }
.summary-table tbody tr:last-child, .breakdown-table tbody tr:hover { background: var(--accent-soft); }
.breakdown-table { min-width: 0; table-layout: fixed; }
.breakdown-table th, .breakdown-table td { min-width: 68px; padding: 6px; font-size: 12px; }
.breakdown-table th:first-child, .breakdown-table td:first-child { width: 34%; min-width: 150px; white-space: normal; }
.breakdown-table tbody th { vertical-align: middle; }
.overview-layout { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(360px, .9fr); gap: 28px; padding-top: 20px; }
.report-section { min-width: 0; }
.report-section h2 { margin-bottom: 4px; }
.section-note { margin-bottom: 11px; font-size: 12px; }
.product-link { border: 0; padding: 0; background: transparent; color: var(--accent); text-align: left; cursor: pointer; font-weight: 600; }
.product-link:hover { text-decoration: underline; }
.product-link[aria-pressed="true"] { color: var(--text); text-decoration: underline; }
.product-select { min-height: 32px; max-width: 100%; border: 1px solid var(--rule-strong); border-radius: 2px; padding: 4px 8px; background: var(--surface); color: var(--text); }
.chart-options { display: flex; flex-wrap: wrap; gap: 12px; margin: 12px 0 6px; }
.chart-options .toggle { min-height: 24px; font-size: 12px; }
.chart-wrap { overflow: hidden; width: 100%; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); }
.trend-chart { display: block; width: 100%; min-width: 360px; height: auto; }
.chart-grid { stroke: var(--rule); stroke-width: 1; }
.chart-axis { fill: var(--muted); font: 11px "Segoe UI", Arial, sans-serif; }
.chart-line { fill: none; stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
.chart-point { stroke: var(--surface); stroke-width: 2; }
.trend-caption { min-height: 18px; margin: 7px 0 0; color: var(--muted); font-size: 12px; }
.no-results { padding: 18px 10px; color: var(--muted); text-align: center; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --page: #151a1e;
    --surface: #151a1e;
    --text: #e6edf1;
    --muted: #a7b3bb;
    --rule: #374149;
    --rule-strong: #617079;
    --accent: #71bad3;
    --accent-soft: #202e35;
    --positive: #83d2a5;
    --negative: #ff938b;
    --focus: #8bc9ff;
    --chart-budget: #f2b84b;
    --chart-prior: #a7b3bb;
  }
  .chip[aria-pressed="true"] { color: #10232b; }
  .view-button[aria-pressed="true"] { color: #10232b; }
}
@media (max-width: 720px) {
  .page { padding: 16px 12px 26px; }
  .masthead { align-items: start; flex-direction: column; gap: 5px; }
  .sample-label { white-space: normal; }
  th:first-child, td:first-child { min-width: 210px; }
  th, td { min-width: 84px; padding: 7px 8px; }
  .overview-summary, .overview-layout { grid-template-columns: 1fr; gap: 16px; }
  .overview-summary { padding-top: 15px; }
  .summary-table, .breakdown-table { min-width: 540px; }
}
@media print {
  @page { size: landscape; margin: 10mm; }
  body { background: #fff; color: #000; font-size: 8pt; }
  .page { padding: 0; }
  .controls, .status, .sample-label { display: none !important; }
  .masthead { padding-bottom: 6px; }
  h1 { font-size: 16pt; }
  .grid-scroll { overflow: visible; border-top: 0; }
  table { width: 100%; min-width: 0; font-size: 6.5pt; }
  th, td { min-width: 0; padding: 3px 4px; white-space: normal; }
  th:first-child, td:first-child, thead th { position: static; }
  th:first-child, td:first-child { min-width: 125px; }
  .block-toggle { color: #000; }
  .chevron { display: none; }
  tbody tr:hover td, tbody tr:hover td:first-child { background: transparent; }
  .positive, .negative { color: #000; }
  .overview-layout { display: block; }
  .report-section { margin: 12px 0; }
  .trend-chart { min-width: 0; }
}
</style>
</head>

<main class="page">
  <header class="masthead">
    <div>
      <h1>Super Summary</h1>
      <p class="subtitle">FY27 outlook · amounts in US$ millions</p>
    </div>
    <span class="sample-label">Synthetic sample data · illustrative only</span>
  </header>
  <section class="controls" aria-label="View controls">
    <div class="control-row">
      <span class="control-title" id="segment-label">Segment</span>
      <nav class="chip-list" id="segment-chips" aria-labelledby="segment-label">
        <button class="chip" type="button" data-segment="EMEA (All)">EMEA (All)</button>
        <button class="chip" type="button" data-segment="CEMA">CEMA</button>
        <button class="chip" type="button" data-segment="DACH">DACH</button>
        <button class="chip" type="button" data-segment="FR + Benelux">FR + Benelux</button>
        <button class="chip" type="button" data-segment="UK &amp; Ireland">UK &amp; Ireland</button>
        <button class="chip" type="button" data-segment="Western Europe">Western Europe</button>
        <button class="chip" type="button" data-segment="UK&amp;I SMB">UK&amp;I SMB</button>
      </nav>
    </div>
    <div class="control-row">
      <span class="control-title" id="period-label">Period</span>
      <nav class="chip-list" id="period-chips" aria-labelledby="period-label">
        <button class="chip" type="button" data-period="Q1">Q1</button>
        <button class="chip" type="button" data-period="Q2">Q2</button>
        <button class="chip" type="button" data-period="Q3">Q3</button>
        <button class="chip" type="button" data-period="Q4">Q4</button>
        <button class="chip" type="button" data-period="FY">FY</button>
        <button class="chip" type="button" data-period="All">All</button>
      </nav>
    </div>
    <div class="control-row">
      <span class="control-title" id="view-label">View</span>
      <nav class="view-list" aria-labelledby="view-label">
        <button class="view-button" type="button" data-view="overview">Overview</button>
        <button class="view-button" type="button" data-view="grid">Replica grid</button>
      </nav>
    </div>
    <div class="control-row">
      <label class="control-title" for="product-search">Product</label>
      <input class="control-input search-input" id="product-search" type="search" placeholder="Filter product blocks" autocomplete="off">
    </div>
    <div class="control-row" id="grid-options" hidden>
      <span class="control-title">Display</span>
      <div class="toggle-list">
        <label class="toggle"><input id="detail-toggle" type="checkbox" checked><span class="toggle-label">Detail lines</span></label>
        <label class="toggle"><input id="other-toggle" type="checkbox"><span class="toggle-label">Other VL only</span></label>
        <label class="toggle"><input id="cfo-toggle" type="checkbox"><span class="toggle-label">Hide Prior CFO / VTPF</span></label>
      </div>
    </div>
  </section>
  <p class="status" id="status" role="status" aria-live="polite"></p>
  <section class="view-panel" id="overview-view" aria-labelledby="overview-heading">
    <div class="overview-summary">
      <div>
        <h2 id="overview-heading">Landing summary</h2>
        <p class="summary-copy" id="summary-copy"></p>
      </div>
      <div class="summary-table-wrap">
        <table class="summary-table" id="summary-metrics"></table>
      </div>
    </div>
    <div class="overview-layout">
      <section class="report-section" aria-labelledby="breakdown-heading">
        <h2 id="breakdown-heading">Product outlook</h2>
        <p class="section-note">Select a product to update the quarterly trend. Amounts are in US$M.</p>
        <div class="table-scroll">
          <table class="breakdown-table" id="product-breakdown"></table>
        </div>
      </section>
      <section class="report-section" aria-labelledby="trend-heading">
        <h2 id="trend-heading">Quarterly trend</h2>
        <p class="section-note">Forecast, budget, and prior year by quarter · US$M</p>
        <label class="sr-only" for="trend-product">Product for quarterly trend</label>
        <select class="product-select" id="trend-product"></select>
        <div class="chart-options" aria-label="Trend series">
          <label class="toggle"><input id="trend-forecast" type="checkbox" checked><span class="toggle-label">Forecast</span></label>
          <label class="toggle"><input id="trend-budget" type="checkbox" checked><span class="toggle-label">Budget</span></label>
          <label class="toggle"><input id="trend-prior" type="checkbox" checked><span class="toggle-label">Prior year</span></label>
        </div>
        <div class="chart-wrap">
          <svg class="trend-chart" id="trend-chart" viewBox="0 0 720 280" role="img" aria-label="Quarterly trend chart"></svg>
        </div>
        <p class="trend-caption" id="trend-caption" aria-live="polite"></p>
      </section>
    </div>
  </section>
  <section class="view-panel" id="grid-view" aria-label="Replica grid" hidden>
    <div class="grid-scroll" id="grid-scroll" tabindex="0" aria-label="Scrollable Super Summary grid">
      <table id="summary-grid"></table>
    </div>
  </section>
</main>

<script>
"use strict";
const dataBySegment = JSON.parse(document.getElementById("summary-data").textContent);
const segments = ["EMEA (All)", "CEMA", "DACH", "FR + Benelux", "UK & Ireland", "Western Europe", "UK&I SMB"];
const periods = ["Q1", "Q2", "Q3", "Q4", "FY"];
const baseColumns = [
  {label:"Fcst", key:"F"},
  {label:"PY", key:"P"},
  {label:"Budget", key:"B"},
  {label:"Prior CFO", key:"C"},
  {label:"VTB", key:"V"},
  {label:"VTPF", key:"T"},
  {label:"YoY%", key:"Y"}
];
const lineOrder = ["Total", "EA", "EA Recurring", "EA Renewal", "EA New & AO", "CSP", "CSP Annual", "CSP Monthly", "Other VL"];
const state = {
  segment: segments.find(segment => Object.hasOwn(dataBySegment, segment)) || "",
  period: "All",
  view: "overview",
  search: "",
  selectedProduct: "",
  detailLines: true,
  otherOnly: false,
  hideCfo: false,
  chartSeries: {F: true, B: true, P: true},
  collapsed: new Set()
};
const $ = id => document.getElementById(id);
const table = $("summary-grid");
const status = $("status");

function formatAmount(value) {
  if (value === null || value === undefined || !Number.isFinite(value)) return "n/a";
  if (value === 0) return "–";
  const formatted = Math.abs(value).toLocaleString("en-US", {minimumFractionDigits:1, maximumFractionDigits:1});
  return value < 0 ? `(${formatted})` : formatted;
}

function formatVariance(value) {
  if (value === null || value === undefined || !Number.isFinite(value)) return "n/a";
  if (value === 0) return "–";
  const formatted = Math.abs(value).toLocaleString("en-US", {minimumFractionDigits:1, maximumFractionDigits:1});
  return value < 0 ? `(${formatted})` : `+${formatted}`;
}

function derive(values) {
  const forecast = values.F;
  const py = values.P;
  const budget = values.B;
  const priorCfo = values.C;
  return {
    ...values,
    V: forecast == null || budget == null ? null : forecast - budget,
    T: forecast == null || priorCfo == null ? null : forecast - priorCfo,
    Y: forecast == null || py == null || py === 0 ? null : forecast / py - 1
  };
}

function formatValue(value, key) {
  if (key !== "Y") return key === "V" || key === "T" ? formatVariance(value) : formatAmount(value);
  if (value === null || value === undefined || !Number.isFinite(value)) return "n/a";
  if (value === 0) return "–";
  const formatted = `${Math.abs(value * 100).toFixed(1)}%`;
  return value < 0 ? `(${formatted})` : `+${formatted}`;
}

function visibleColumns() {
  return state.hideCfo
    ? baseColumns.filter(column => column.key !== "C" && column.key !== "T")
    : baseColumns;
}

function createCell(tag, label, scope) {
  const cell = document.createElement(tag);
  cell.textContent = label;
  if (scope) cell.scope = scope;
  return cell;
}

function renderControls() {
  document.querySelectorAll("[data-segment]").forEach(button => {
    const available = Object.hasOwn(dataBySegment, button.dataset.segment);
    button.disabled = !available;
    button.setAttribute("aria-pressed", String(button.dataset.segment === state.segment));
  });
  document.querySelectorAll("[data-period]").forEach(button => {
    button.setAttribute("aria-pressed", String(button.dataset.period === state.period));
  });
  document.querySelectorAll("[data-view]").forEach(button => {
    button.setAttribute("aria-pressed", String(button.dataset.view === state.view));
  });
  $("overview-view").hidden = state.view !== "overview";
  $("grid-view").hidden = state.view !== "grid";
  $("grid-options").hidden = state.view !== "grid";
  if ($("product-search").value !== state.search) $("product-search").value = state.search;
  $("detail-toggle").checked = state.detailLines;
  $("other-toggle").checked = state.otherOnly;
  $("cfo-toggle").checked = state.hideCfo;
  $("trend-forecast").checked = state.chartSeries.F;
  $("trend-budget").checked = state.chartSeries.B;
  $("trend-prior").checked = state.chartSeries.P;
}

function renderGrid() {
  const segmentData = dataBySegment[state.segment];
  if (!segmentData) {
    table.replaceChildren();
    status.textContent = "No data is loaded for this segment. Choose an available segment.";
    return;
  }

  const shownPeriods = state.period === "All" ? periods : [state.period];
  const columns = visibleColumns();
  const caption = document.createElement("caption");
  caption.textContent = `${state.segment} · ${state.period === "All" ? "All periods" : state.period} · amounts in US$M; percentages are percent`;
  const thead = document.createElement("thead");
  const groupRow = document.createElement("tr");
  const rowHeading = createCell("th", "Block / line", "col");
  rowHeading.rowSpan = 2;
  groupRow.append(rowHeading);
  shownPeriods.forEach(period => {
    const heading = createCell("th", period, "colgroup");
    heading.colSpan = columns.length;
    groupRow.append(heading);
  });
  const fieldRow = document.createElement("tr");
  shownPeriods.forEach(() => columns.forEach(column => fieldRow.append(createCell("th", column.label, "col"))));
  thead.append(groupRow, fieldRow);

  const tbody = document.createElement("tbody");
  const matchingProducts = Object.entries(segmentData).filter(([block]) =>
    block.toLocaleLowerCase().includes(state.search.toLocaleLowerCase())
  );
  matchingProducts.forEach(([block, lines], blockIndex) => {
    const isCollapsed = state.collapsed.has(block);
    lineOrder.forEach(line => {
      if (!lines[line]) return;
      if (line !== "Total" && isCollapsed) return;
      if (state.otherOnly && line !== "Total" && line !== "Other VL") return;
      if (!state.detailLines && ["EA Recurring", "EA Renewal", "EA New & AO", "CSP Annual", "CSP Monthly"].includes(line)) return;

      const row = document.createElement("tr");
      row.className = line === "Total" ? "block-total" :
        ["EA", "CSP"].includes(line) ? "summary-line" :
        line === "Other VL" ? "other-line" : "detail-line";

      const rowLabel = document.createElement("th");
      rowLabel.scope = "row";
      if (line === "Total") {
        const toggle = document.createElement("button");
        toggle.type = "button";
        toggle.className = "block-toggle";
        toggle.id = `collapse-${blockIndex}`;
        toggle.dataset.block = block;
        toggle.setAttribute("aria-expanded", String(!isCollapsed));
        toggle.setAttribute("aria-label", `${isCollapsed ? "Expand" : "Collapse"} ${block}`);
        const icon = document.createElement("span");
        icon.className = "chevron";
        icon.setAttribute("aria-hidden", "true");
        icon.textContent = isCollapsed ? "＋" : "−";
        const title = document.createElement("span");
        title.textContent = `${block} · Total`;
        toggle.append(icon, title);
        rowLabel.append(toggle);
      } else {
        rowLabel.textContent = line;
      }
      row.append(rowLabel);

      shownPeriods.forEach(period => {
        const values = derive(lines[line][period] || {});
        columns.forEach(column => {
          const value = values[column.key];
          const cell = document.createElement("td");
          cell.textContent = formatValue(value, column.key);
          if ((column.key === "V" || column.key === "Y") && value != null && value !== 0) {
            cell.className = value > 0 ? "positive" : "negative";
          }
          row.append(cell);
        });
      });
      tbody.append(row);
    });
  });

  if (!matchingProducts.length) {
    const row = document.createElement("tr");
    const cell = createCell("td", "No product blocks match this filter.");
    cell.colSpan = 1 + shownPeriods.length * columns.length;
    cell.className = "empty";
    row.append(cell);
    tbody.append(row);
  }
  table.replaceChildren(caption, thead, tbody);
}

function getMatchingProducts(segmentData) {
  const query = state.search.trim().toLocaleLowerCase();
  return Object.entries(segmentData).filter(([block]) => block.toLocaleLowerCase().includes(query));
}

function aggregatePeriod(products, period) {
  const keys = ["F", "P", "B", "C"];
  const sums = Object.fromEntries(keys.map(key => [key, 0]));
  const counts = Object.fromEntries(keys.map(key => [key, 0]));
  products.forEach(([, lines]) => {
    const values = lines.Total && lines.Total[period];
    if (!values) return;
    keys.forEach(key => {
      if (!Number.isFinite(values[key])) return;
      sums[key] += values[key];
      counts[key] += 1;
    });
  });
  keys.forEach(key => {
    if (!counts[key]) sums[key] = null;
  });
  return derive(sums);
}

function renderSummaryMetrics(products) {
  const metrics = $("summary-metrics");
  const caption = document.createElement("caption");
  caption.textContent = "Portfolio totals · sum of available product blocks · US$M";
  const thead = document.createElement("thead");
  const header = document.createElement("tr");
  ["Period", "Forecast", "Budget", "VTB", "Prior year", "YoY"].forEach((label, index) => {
    header.append(createCell("th", label, index === 0 ? "col" : "col"));
  });
  thead.append(header);
  const tbody = document.createElement("tbody");
  const shownPeriods = state.period === "All" ? periods : [state.period];
  shownPeriods.forEach(period => {
    const values = aggregatePeriod(products, period);
    const row = document.createElement("tr");
    row.append(createCell("th", period, "row"));
    ["F", "B", "V", "P", "Y"].forEach(key => {
      const cell = createCell("td", formatValue(values[key], key));
      if ((key === "V" || key === "Y") && values[key] != null && values[key] !== 0) {
        cell.className = values[key] > 0 ? "positive" : "negative";
      }
      row.append(cell);
    });
    tbody.append(row);
  });
  metrics.replaceChildren(caption, thead, tbody);

  const copy = $("summary-copy");
  if (!products.length) {
    copy.textContent = "No product blocks match this filter. Clear the product search to restore the summary.";
  } else if (state.period === "All") {
    copy.textContent = `Showing all five periods across ${products.length} matching product blocks. Select a period to focus the summary. Amounts are in US$M.`;
  } else {
    const values = aggregatePeriod(products, state.period);
    copy.textContent = `${state.period} forecast is ${formatAmount(values.F)} US$M, ${formatVariance(values.V)} US$M vs budget and ${formatValue(values.Y, "Y")} vs prior year, across ${products.length} matching product blocks.`;
  }
}

function renderBreakdown(products) {
  const breakdown = $("product-breakdown");
  const caption = document.createElement("caption");
  caption.textContent = "Values in US$M; YoY is a percentage";
  const thead = document.createElement("thead");
  const header = document.createElement("tr");
  ["Product", "Period", "Forecast", "Budget", "VTB", "Prior year", "YoY"].forEach(label => {
    header.append(createCell("th", label, "col"));
  });
  thead.append(header);
  const tbody = document.createElement("tbody");
  const shownPeriods = state.period === "All" ? periods : [state.period];
  products.forEach(([block, lines]) => {
    shownPeriods.forEach((period, periodIndex) => {
      const values = derive((lines.Total && lines.Total[period]) || {});
      const row = document.createElement("tr");
      if (periodIndex === 0) {
        const productCell = document.createElement("th");
        productCell.scope = "row";
        productCell.rowSpan = shownPeriods.length;
        const button = document.createElement("button");
        button.type = "button";
        button.className = "product-link";
        button.dataset.product = block;
        button.setAttribute("aria-pressed", String(block === state.selectedProduct));
        button.textContent = block;
        productCell.append(button);
        row.append(productCell);
      }
      row.append(createCell("td", period));
      ["F", "B", "V", "P", "Y"].forEach(key => {
        const cell = createCell("td", formatValue(values[key], key));
        if ((key === "V" || key === "Y") && values[key] != null && values[key] !== 0) {
          cell.className = values[key] > 0 ? "positive" : "negative";
        }
        row.append(cell);
      });
      tbody.append(row);
    });
  });
  if (!products.length) {
    const row = document.createElement("tr");
    const cell = createCell("td", "No product blocks match this filter.");
    cell.colSpan = 7;
    cell.className = "no-results";
    row.append(cell);
    tbody.append(row);
  }
  breakdown.replaceChildren(caption, thead, tbody);
}

const svgNamespace = "http://www.w3.org/2000/svg";
function svgElement(name, attributes = {}) {
  const element = document.createElementNS(svgNamespace, name);
  Object.entries(attributes).forEach(([key, value]) => element.setAttribute(key, value));
  return element;
}

function renderTrend(products) {
  const select = $("trend-product");
  const svg = $("trend-chart");
  const caption = $("trend-caption");
  select.replaceChildren();
  products.forEach(([block]) => {
    const option = document.createElement("option");
    option.value = block;
    option.textContent = block;
    select.append(option);
  });

  if (!products.length) {
    state.selectedProduct = "";
    select.disabled = true;
    svg.replaceChildren();
    svg.append(svgElement("text", {x:"360", y:"140", "text-anchor":"middle", class:"chart-axis"}));
    svg.lastChild.textContent = "No matching product";
    caption.textContent = "Clear the product filter to view a quarterly trend.";
    return;
  }

  select.disabled = false;
  if (!products.some(([block]) => block === state.selectedProduct)) state.selectedProduct = products[0][0];
  select.value = state.selectedProduct;
  const lines = products.find(([block]) => block === state.selectedProduct)[1];
  const quarterData = periods.slice(0, 4).map(period => (lines.Total && lines.Total[period]) || {});
  const series = [
    {key:"F", label:"Forecast", color:"var(--accent)"},
    {key:"B", label:"Budget", color:"var(--chart-budget)"},
    {key:"P", label:"Prior year", color:"var(--chart-prior)"}
  ].filter(item => state.chartSeries[item.key]);
  const allValues = series.flatMap(item => quarterData.map(values => values[item.key]).filter(Number.isFinite));
  svg.replaceChildren();
  svg.setAttribute("aria-label", `${state.selectedProduct} quarterly forecast, budget, and prior year in US$ millions`);
  if (!series.length || !allValues.length) {
    const message = svgElement("text", {x:"360", y:"140", "text-anchor":"middle", class:"chart-axis"});
    message.textContent = series.length ? "No values available for this product" : "Select a series to display";
    svg.append(message);
    caption.textContent = `${state.selectedProduct} · values in US$M`;
    return;
  }

  const width = 720;
  const height = 280;
  const margin = {top:14, right:18, bottom:34, left:58};
  const plotWidth = width - margin.left - margin.right;
  const plotHeight = height - margin.top - margin.bottom;
  const rawMin = Math.min(0, ...allValues);
  const rawMax = Math.max(0, ...allValues);
  const spread = rawMax - rawMin || 1;
  const minValue = rawMin < 0 ? rawMin - spread * .06 : 0;
  const maxValue = rawMax + spread * .06;
  const x = index => margin.left + plotWidth * index / 3;
  const y = value => margin.top + (maxValue - value) / (maxValue - minValue) * plotHeight;

  for (let tick = 0; tick <= 4; tick += 1) {
    const value = minValue + (maxValue - minValue) * tick / 4;
    const yPosition = y(value);
    svg.append(svgElement("line", {x1:margin.left, y1:yPosition, x2:width - margin.right, y2:yPosition, class:"chart-grid"}));
    const label = svgElement("text", {x:margin.left - 9, y:yPosition + 4, "text-anchor":"end", class:"chart-axis"});
    label.textContent = Math.round(value).toLocaleString("en-US");
    svg.append(label);
  }
  periods.slice(0, 4).forEach((period, index) => {
    const label = svgElement("text", {x:x(index), y:height - 10, "text-anchor":"middle", class:"chart-axis"});
    label.textContent = period;
    svg.append(label);
  });
  series.forEach(item => {
    let pathData = "";
    let hasPrevious = false;
    quarterData.forEach((values, index) => {
      const value = values[item.key];
      if (!Number.isFinite(value)) {
        hasPrevious = false;
        return;
      }
      pathData += `${hasPrevious ? "L" : "M"} ${x(index)} ${y(value)} `;
      hasPrevious = true;
    });
    svg.append(svgElement("path", {d:pathData.trim(), class:"chart-line", stroke:item.color}));
    quarterData.forEach((values, index) => {
      const value = values[item.key];
      if (!Number.isFinite(value)) return;
      const point = svgElement("circle", {cx:x(index), cy:y(value), r:4, fill:item.color, class:"chart-point"});
      const title = svgElement("title");
      title.textContent = `${item.label} ${periods[index]}: ${formatAmount(value)} US$M`;
      point.append(title);
      svg.append(point);
    });
  });
  caption.textContent = `${state.selectedProduct} · select a product row or use the menu to change the trend.`;
}

function renderOverview() {
  const segmentData = dataBySegment[state.segment];
  if (!segmentData) {
    $("summary-copy").textContent = "No data is loaded for this segment.";
    $("summary-metrics").replaceChildren();
    $("product-breakdown").replaceChildren();
    renderTrend([]);
    return;
  }
  const products = getMatchingProducts(segmentData);
  renderSummaryMetrics(products);
  renderBreakdown(products);
  renderTrend(products);
}

function render() {
  renderControls();
  renderOverview();
  renderGrid();
  const segmentData = dataBySegment[state.segment] || {};
  const productCount = Object.keys(segmentData).length;
  const visibleCount = getMatchingProducts(segmentData).length;
  status.textContent = `${visibleCount} of ${productCount} product blocks · ${state.period === "All" ? "Q1–FY" : state.period} · ${state.view === "overview" ? "Overview" : "Replica grid"}`;
}

document.querySelectorAll("[data-view]").forEach(button => {
  button.addEventListener("click", () => {
    state.view = button.dataset.view;
    render();
  });
});
document.querySelectorAll("[data-segment]").forEach(button => {
  button.addEventListener("click", () => {
    if (button.disabled) return;
    state.segment = button.dataset.segment;
    state.collapsed.clear();
    state.selectedProduct = "";
    render();
  });
});
document.querySelectorAll("[data-period]").forEach(button => {
  button.addEventListener("click", () => {
    state.period = button.dataset.period;
    render();
  });
});
$("product-search").addEventListener("input", event => {
  state.search = event.currentTarget.value;
  render();
});
$("trend-product").addEventListener("change", event => {
  state.selectedProduct = event.currentTarget.value;
  render();
});
[
  ["trend-forecast", "F"],
  ["trend-budget", "B"],
  ["trend-prior", "P"]
].forEach(([id, key]) => {
  $(id).addEventListener("change", event => {
    state.chartSeries[key] = event.currentTarget.checked;
    render();
  });
});
$("detail-toggle").addEventListener("change", event => {
  state.detailLines = event.currentTarget.checked;
  render();
});
$("other-toggle").addEventListener("change", event => {
  state.otherOnly = event.currentTarget.checked;
  render();
});
$("cfo-toggle").addEventListener("change", event => {
  state.hideCfo = event.currentTarget.checked;
  render();
});
$("product-breakdown").addEventListener("click", event => {
  const button = event.target.closest("[data-product]");
  if (!button) return;
  state.selectedProduct = button.dataset.product;
  render();
});
table.addEventListener("click", event => {
  const button = event.target.closest("[data-block]");
  if (!button) return;
  const block = button.dataset.block;
  if (state.collapsed.has(block)) state.collapsed.delete(block);
  else state.collapsed.add(block);
  const buttonId = button.id;
  render();
  $(buttonId)?.focus();
});

render();
</script>
</body>
</html>
